<style>
.tr .grp { color: var(--brand); } /* (1.66) le groupe d'entraînement : Groupe Gianni, Groupe Enzo… */
.b.cal { min-height: 40px; font-size: 15px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 10px 0 4px; }
.ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg); display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-view { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: grid; place-items: center; z-index: 9; padding: 16px; color: #fff; text-align: center; }
.ph-view[hidden] { display: none; }
.ph-view img { max-width: 100%; max-height: 85vh; border-radius: 8px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who label { display: flex; flex-direction: column; gap: 6px; width: 100%; font-weight: 700; }
.who select { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; font-weight: 600; }
.b.small { min-height: 36px; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tiles div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.tiles b { display: block; font-size: 22px; } .tiles span { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* (1.60) the tables of the category */
.st-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.st-tabs .b.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.st-card h3 { font-size: 15px; margin: 12px 0 6px; }
.st-table, .st-res { width: 100%; border-collapse: collapse; font-size: 14px; }
.st-table th, .st-table td, .st-res td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.st-table th { font-size: 12px; color: var(--muted); }
.st-res .h { text-align: right; width: 44%; } .st-res .s { text-align: center; font-weight: 800; white-space: nowrap; }
.st-table tr.own td, .st-res tr.own td { background: color-mix(in srgb, var(--brand) 10%, var(--surface)); font-weight: 700; }
.card.next { border: 2px solid var(--brand); }
.mine-box { margin: 10px 0; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 9%, var(--surface)); display: flex; flex-direction: column; gap: 8px; }
.mine-box.off { color: var(--muted); }
.mine-box .b { flex: 1; min-height: 50px; font-size: 16px; }
.talk { margin: 12px 0; padding: 14px; border-radius: 14px; background: var(--navy); color: #fff; }
.talk h3 { margin: 0 0 6px; font-size: 17px; color: #e2c27d; }
.talk .obj { font-weight: 800; font-size: 17px; margin: 4px 0 8px; }
.talk .info, .talk .info b { color: #dbe2f5; }
.keys { margin: 6px 0; padding-left: 22px; font-weight: 700; font-size: 16px; } .keys li + li { margin-top: 4px; }
.final { font-style: italic; opacity: .92; margin: 8px 0 0; }
.b.vid { display: inline-flex; align-items: center; text-decoration: none; background: #e2c27d; color: #0e1d45; border: 0; }
.conv summary { cursor: pointer; margin-top: 8px; }
.me-line { margin: 4px 0; } .me-line b { color: var(--brand); }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14px; margin-top: 6px; }
.grid2 .mine, .board .mine { color: var(--brand); font-weight: 800; }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.board h3 { margin: 0 0 6px; font-size: 15px; }
.board p { display: flex; justify-content: space-between; margin: 3px 0; font-size: 14px; }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.wb h3 { margin: 0 0 4px; } .wb-done { color: var(--yes); font-weight: 700; }
.wb-row { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; } .wb-row > span:first-child { font-weight: 700; font-size: 15px; }
.wb-scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.wb-scale button { min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; padding: 0; }
.wb-scale button.on { color: #fff; border-color: transparent; }
.wb-scale .v1.on, .wb-scale .v2.on, .wb-scale .v3.on, .wb-scale .v4.on { background: #dc2626; } .wb-scale .v5.on, .wb-scale .v6.on, .wb-scale .v7.on { background: #ca8a04; } .wb-scale .v8.on, .wb-scale .v9.on, .wb-scale .v10.on { background: #16a34a; }
.wb-note { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 0 12px; margin: 6px 0 10px; font: inherit; background: var(--surface); color: var(--ink); }
/* personal code (3.42) */
.code-card h2 { margin: 4px 0 6px; }
.code-cat { display: inline-block; margin: 0 0 4px; padding: 3px 10px; border-radius: 999px; background: var(--navy); color: #e2c27d; font-weight: 800; font-size: 14px; }
#codeForm { display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
.code-in { flex: 1 1 180px; min-height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px;
  font: 800 24px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.code-in:focus { outline: none; border-color: var(--brand); }
.code-go { min-height: 54px; min-width: 110px; font-size: 17px; }
.code-err { min-height: 1.2em; color: var(--no); font-weight: 700; margin: 4px 0 10px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.b.lnk { display: inline-flex; align-items: center; text-decoration: none; }
.me-line { margin: 4px 0; } .me-line b { color: var(--brand); }
.credit { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 calc(env(safe-area-inset-bottom) + 18px); }
/* ---------- 1.61 : jeu des pronos ---------- */
.gm h2 { margin: 0 0 6px; } .gm h3 { font-size: 15px; margin: 14px 0 6px; }
.gm-sub { font-size: 13px; font-weight: 600; color: var(--muted, #667); }
.gm-info { font-size: 13px; color: var(--muted, #667); margin: 6px 0; }
.gm-warn { padding: 8px 10px; border-radius: 10px; background: #fff4d6; color: #7a5200; font-size: 14px; }
.gm-favbox { display: flex; gap: 8px; align-items: flex-end; margin: 8px 0; }
.gm-favbox label { flex: 1; min-width: 0; display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.gm-favbox input { width: 100%; min-width: 0; box-sizing: border-box; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line, #d9dde3); border-radius: 10px; font: inherit; }
.gm-btn { min-height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: #8c1024; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
.gm-m { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line, #e5e7eb); }
.gm-t { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; min-width: 0; }
.gm-t span { overflow: hidden; text-overflow: ellipsis; } .gm-t.r { justify-content: flex-end; text-align: right; }
.gm-b { width: 24px; height: 24px; object-fit: contain; flex: none; }
.gm-s { display: grid; justify-items: center; gap: 2px; text-align: center; }
.gm-s small { font-size: 11px; color: var(--muted, #667); } .gm-oth { max-width: 160px; }
.gm-in { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; }
.gm-in input { width: 44px; height: 40px; text-align: center; font: inherit; font-size: 18px; font-weight: 800; border: 2px solid var(--line, #d9dde3); border-radius: 10px; }
.gm-gage { margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: #fde8eb; border: 1px solid #f3b7c0; }
.gm-gage ul { margin: 6px 0 0; padding-left: 18px; }
.gm-rank { width: 100%; border-collapse: collapse; font-size: 14px; }
.gm-rank td { padding: 6px 4px; border-bottom: 1px solid var(--line, #e5e7eb); } .gm-rank tr.me td { background: #fff4d6; font-weight: 700; }
.gm-x { color: var(--muted, #667); font-size: 12px; text-align: right; }
.gm-fav { font-size: 12px; color: var(--muted, #667); font-weight: 600; }
.gm-past summary, .gm-set summary { cursor: pointer; font-weight: 700; margin: 10px 0 6px; }
.gm-set label { display: grid; gap: 4px; margin: 8px 0; font-size: 13px; font-weight: 700; }
.gm-set textarea { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line, #d9dde3); }
.gm-chk { display: flex !important; align-items: center; gap: 8px; }
.gm-src { font-size: 11px; }
/* (1.63) the session shown to a player who answered « présent » */
.sess { grid-column: 1 / -1; margin: 6px 0 4px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 7%, var(--surface)); border: 1px solid var(--line); }
.sess h4 { margin: 0 0 6px; font-size: 15px; } .sess .obj { margin: 4px 0 8px; font-weight: 600; }
textarea.wb-note { padding: 10px 12px; resize: vertical; }
.prof-row { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 10px; align-items: end; }
.prof-row label, .prof-l { display: grid; gap: 4px; font-size: 14px; font-weight: 600; } .prof-l { margin-top: 10px; }
.prof-row input { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 0 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
.bmi { display: grid; text-align: center; padding: 6px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 9%, var(--surface)); } .bmi b { font-size: 22px; } .bmi span { font-size: 12px; opacity: .8; }
.msg-card .btns { margin-bottom: 4px; }
.prof-card .b.small.on, .msg-card .b.small.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.sess-ex { margin: 0; padding-left: 20px; } .sess-ex li { margin: 6px 0; }
