<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FA Le Raincy · Mon espace</title>
<meta name="description" content="L'espace personnel des joueurs et des parents du club, avec le code donné par le club">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1d45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raincy">
<link rel="icon" href="icons/crest.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="famille.css?v=200">
<style>
.b.cal { min-height: 40px; font-size: 15px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin: 10px 0 4px; }
.ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg); display: grid; place-items: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-view { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: grid; place-items: center; z-index: 9; padding: 16px; color: #fff; text-align: center; }
.ph-view[hidden] { display: none; }
.ph-view img { max-width: 100%; max-height: 85vh; border-radius: 8px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who label { display: flex; flex-direction: column; gap: 6px; width: 100%; font-weight: 700; }
.who select { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 10px; font-weight: 600; }
.b.small { min-height: 36px; font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tiles div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.tiles b { display: block; font-size: 22px; } .tiles span { font-size: 12px; color: var(--muted); }
.card.next { border: 2px solid var(--brand); }
.mine-box { margin: 10px 0; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 9%, var(--surface)); display: flex; flex-direction: column; gap: 8px; }
.mine-box.off { color: var(--muted); }
.mine-box .b { flex: 1; min-height: 50px; font-size: 16px; }
.talk { margin: 12px 0; padding: 14px; border-radius: 14px; background: var(--navy); color: #fff; }
.talk h3 { margin: 0 0 6px; font-size: 17px; color: #e2c27d; }
.talk .obj { font-weight: 800; font-size: 17px; margin: 4px 0 8px; }
.talk .info, .talk .info b { color: #dbe2f5; }
.keys { margin: 6px 0; padding-left: 22px; font-weight: 700; font-size: 16px; } .keys li + li { margin-top: 4px; }
.final { font-style: italic; opacity: .92; margin: 8px 0 0; }
.b.vid { display: inline-flex; align-items: center; text-decoration: none; background: #e2c27d; color: #0e1d45; border: 0; }
.conv summary { cursor: pointer; margin-top: 8px; }
.me-line { margin: 4px 0; } .me-line b { color: var(--brand); }
.grid2 { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14px; margin-top: 6px; }
.grid2 .mine, .board .mine { color: var(--brand); font-weight: 800; }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.board h3 { margin: 0 0 6px; font-size: 15px; }
.board p { display: flex; justify-content: space-between; margin: 3px 0; font-size: 14px; }
@media (max-width: 480px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.wb h3 { margin: 0 0 4px; } .wb-done { color: var(--yes); font-weight: 700; }
.wb-row { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; } .wb-row > span:first-child { font-weight: 700; font-size: 15px; }
.wb-scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.wb-scale button { min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; padding: 0; }
.wb-scale button.on { color: #fff; border-color: transparent; }
.wb-scale .v1.on, .wb-scale .v2.on, .wb-scale .v3.on, .wb-scale .v4.on { background: #dc2626; } .wb-scale .v5.on, .wb-scale .v6.on, .wb-scale .v7.on { background: #ca8a04; } .wb-scale .v8.on, .wb-scale .v9.on, .wb-scale .v10.on { background: #16a34a; }
.wb-note { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); padding: 0 12px; margin: 6px 0 10px; font: inherit; background: var(--surface); color: var(--ink); }
/* personal code (3.42) */
.code-card h2 { margin: 4px 0 6px; }
.code-cat { display: inline-block; margin: 0 0 4px; padding: 3px 10px; border-radius: 999px; background: var(--navy); color: #e2c27d; font-weight: 800; font-size: 14px; }
#codeForm { display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
.code-in { flex: 1 1 180px; min-height: 54px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px;
  font: 800 24px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
.code-in:focus { outline: none; border-color: var(--brand); }
.code-go { min-height: 54px; min-width: 110px; font-size: 17px; }
.code-err { min-height: 1.2em; color: var(--no); font-weight: 700; margin: 4px 0 10px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.b.lnk { display: inline-flex; align-items: center; text-decoration: none; }
.me-line { margin: 4px 0; } .me-line b { color: var(--brand); }
.coach-link { text-align: center; margin: 4px 16px 10px; font-size: 14px; }
.coach-link a { color: inherit; opacity: .85; }
.credit { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 calc(env(safe-area-inset-bottom) + 18px); }
</style>
<link rel="manifest" href="famille.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="top"><div class="top-in"><img src="icons/crest.png" alt="" id="clubCrest"><div><p id="club">FA Le Raincy</p><h1 id="team">Mon espace joueur · parents</h1></div></div></header>
<main id="page"></main>
<p class="coach-link"><a href="index.html" id="coachLink">🧢 Coach ou dirigeant ? Ouvrir l'appli des coachs</a></p>
<p class="credit">Appli du club créée par <b>Coach Enzo</b></p>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/config.js?v=200"></script>
<script src="js/appcfg.js?v=200"></script>
<script src="js/sport.js?v=200"></script>
<script src="js/member.js?v=200"></script>
<script>
(() => {
  // a code in the address (QR code of a card) opens the space at once; otherwise the form (with the category of its QR code)
  const add = /add=1/.test(location.hash), c = Member.current(), page = document.getElementById('page');
  // (2.08) one app for everyone (the stores' app opens here): a coach who chose his app goes straight to it
  const HOME = AppCfg.key('home'), rd = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  document.getElementById('coachLink').onclick = () => { try { localStorage.setItem(HOME, 'coach'); } catch (e) {} };
  if (!c && !add && !/[#&](cat|c)=/.test(location.hash) && rd(HOME) === 'coach') { location.replace('index.html'); return; }
  if (c && !add) {
    page.innerHTML = '<p class="empty">Ouverture de ton espace…</p>';
    Member.rpc('member_view', { p_code: c }).then(d => { Member.remember(c, d); location.replace(Member.pageFor(d)); })
      .catch(e => { if (e.code === 'CODE') Member.forget(c); Member.form(page, { error: e.message }); });
  } else Member.form(page);
})();
</script>
</body>
</html>
